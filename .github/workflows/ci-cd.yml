name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test ──────────────────────────────────────────────
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax check
        run: |
          for f in js/*.js; do node --check "$f" || exit 1; done
          echo "✓ All JS files syntax valid"

      - name: Check for duplicate functions
        run: |
          for f in js/*.js; do
            dup=$(grep "^function " "$f" | cut -d' ' -f2 | cut -d'(' -f1 | sort | uniq -d)
            if [ -n "$dup" ]; then
              echo "✗ Duplicate functions in $f: $dup"
              exit 1
            fi
          done
          echo "✓ No duplicate functions"

  # ── Build & Test (headless browser) ──────────────────────────
  e2e-test:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Start HTTP server
        run: |
          python3 -m http.server 8080 &
          sleep 3
          curl -sf http://localhost:8080/ > /dev/null

      - name: Run Playwright tests
        uses: microsoft/playwright-github-action@v1
        with:
          args: npx playwright test --project=chromium

  # ── Deploy to GitHub Pages ───────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [lint-test, e2e-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4