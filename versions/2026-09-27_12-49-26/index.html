<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn probability, compounding, and CAGR through interactive play">
  <meta name="theme-color" content="#2563eb">
  <title>Probability Playground</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Probability Playground</h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme (system)">🌓</button>
    </header>

    <main class="main">
      <div class="stats-bar" role="status" aria-live="polite">
        <div class="stat">
          <span class="label">Value</span>
          <span id="statV" class="value">100.00</span>
        </div>
        <div class="stat">
          <span class="label">Year</span>
          <span id="statIter" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">CAGR</span>
          <span id="statCagr" class="value">0.00%</span>
        </div>
      </div>

      <section class="chart-section" aria-label="Portfolio history chart">
        <div class="chart-toolbar">
          <label class="toggle">
            <input type="checkbox" id="logScale" aria-label="Use logarithmic scale">
            Log scale
          </label>
        </div>
        <div id="chart" class="chart"></div>
      </section>

      <div class="controls">
        <div class="control-row">
          <button id="btnUp" class="btn primary btn-lg" aria-label="Bet Up (ArrowUp or W)">↑ Up</button>
          <button id="btnDown" class="btn danger btn-lg" aria-label="Bet Down (ArrowDown or S)">↓ Down</button>
        </div>

        <div class="control-row">
          <button id="btnAuto" class="btn secondary" aria-label="Auto-play (Space)">Auto: Off</button>
          <select id="speedSelect" class="speed-select" aria-label="Auto-play speed">
            <option value="100">100 ms</option>
            <option value="250" selected>250 ms</option>
            <option value="500">500 ms</option>
            <option value="1000">1 s</option>
            <option value="2000">2 s</option>
          </select>
        </div>

        <div class="control-row">
          <button id="btnReset" class="btn ghost">Reset</button>
        </div>

        <div class="seed-row">
          <label for="seedInput" class="seed-label">Seed:</label>
          <input type="number" id="seedInput" class="seed-input" placeholder="e.g. 42" aria-label="Random seed (optional)" min="0" max="4294967295">
          <button id="btnExport" class="btn ghost">Export</button>
          <input type="file" id="importFile" class="file-input" accept=".json" hidden>
          <button id="btnImport" class="btn ghost">Import</button>
        </div>
      </div>

      <details class="learn-panel">
        <summary>Learn: Why CAGR ≠ Average Return</summary>
        <div class="learn-content">
          <!-- Slides injected by JS -->
        </div>
      </details>

    </main>

    <footer class="footer">
      <p>Built to teach investing intuition. <a href="https://github.com/" target="_blank" rel="noopener">Source</a> • <a href="#privacy">Privacy</a></p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
